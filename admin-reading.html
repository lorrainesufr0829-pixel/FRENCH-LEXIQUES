<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reading Admin · LEXIQUE</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css?v=20261128-fontfix1"><link rel="stylesheet" href="css/admin-reading.css"></head><body><header class="site-header"><h1>LEXIQUE</h1><p>Daily Reading Administration</p></header><nav class="main-navigation"><ul><li><a href="index.html">HOME</a></li></ul></nav><main class="admin-page"><section id="admin-gate" class="admin-panel"><h2>Administrator access</h2><p id="admin-status">Checking permissions…</p><a href="auth.html">Log in / switch account</a></section><div id="admin-workspace" hidden><section class="admin-panel"><h2 id="form-heading">Create a reading</h2><p>Publish original French learning content or adapted summaries. Do not paste full copyrighted articles.</p><form id="reading-form"><div class="admin-form-grid"><div class="admin-field"><label for="reading-title">French title *</label><input id="reading-title" required></div><div class="admin-field"><label for="reading-date">Publication date</label><input id="reading-date" type="date" required></div><div class="admin-field"><label for="reading-title-en">English title</label><input id="reading-title-en"></div><div class="admin-field"><label for="reading-title-zh">Chinese title</label><input id="reading-title-zh"></div><div class="admin-field"><label for="reading-level">Level</label><select id="reading-level"><option>B1</option><option>B2</option><option selected>B2–C1</option><option>C1</option><option>C2</option></select></div><div class="admin-field"><label for="reading-topic">Topic</label><input id="reading-topic"></div><div class="admin-field full"><label for="reading-content">French reading text *</label><textarea id="reading-content" required></textarea></div><div class="admin-field full"><label for="reading-summary-zh">Chinese summary / notes</label><textarea id="reading-summary-zh"></textarea></div><div class="admin-field full"><label for="reading-vocabulary">Vocabulary JSON array</label><textarea id="reading-vocabulary" placeholder='[{"word":"enjeu","meaning":"重大议题","example":"..."}]'></textarea></div><div class="admin-field"><label for="reading-source">Source name (optional)</label><input id="reading-source" placeholder="RFI / France 24 / Le Monde"></div><div class="admin-field"><label for="reading-source-title">Source title</label><input id="reading-source-title"></div><div class="admin-field full"><label for="reading-source-url">Original source URL (optional attribution)</label><input id="reading-source-url" type="url"></div><div class="admin-field"><label for="reading-status">Status</label><select id="reading-status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></div></div><div class="admin-actions"><button id="save-reading" type="submit">Save</button><button id="reset-reading" type="button">New / clear</button></div></form><p id="admin-status" aria-live="polite"></p></section><section class="admin-panel"><h2>All readings</h2><div id="reading-list">Loading…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth-nav.js"></script><script src="js/admin-reading.js?v=20261128-1"></script></body></html>
