<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Reading · LEXIQUE</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/theme.css?v=20261128-fontfix1"><style>.reading-page{max-width:900px;margin:36px auto;padding:0 22px}.reading-body{white-space:pre-wrap;line-height:1.95;font-size:17px}.reading-vocab,.reading-summary{margin:24px 0;padding:18px;border-radius:12px;background:var(--lexique-surface,#f5f5f5)}.reading-vocab li{margin:14px 0}.reading-vocab .vocab-example{margin:6px 0 2px;font-style:italic}.reading-vocab .vocab-translation{margin:2px 0;color:var(--lexique-muted,#777);font-size:14px}</style></head><body><header class="site-header"><h1>LEXIQUE</h1><p>Daily Reading</p></header><main class="reading-page"><p><a href="index.html">← Home</a></p><article id="reading-article">Loading…</article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id"),root=document.getElementById("reading-article");if(!id){root.textContent="Reading not found.";return;}const {data,error}=await supabaseClient.from("daily_readings").select("*").eq("id",id).eq("status","published").maybeSingle();if(error||!data){root.textContent="This reading is unavailable.";return;}const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));root.innerHTML='<p>'+e(data.source_name||"LEXIQUE · DAILY READING")+'</p><p>'+e(data.level)+' · '+e(data.published_at)+'</p><h1>'+e(data.title)+'</h1>'+(data.summary_zh?'<div class="reading-summary">'+e(data.summary_zh)+'</div>':'')+'<div class="reading-body" lang="fr">'+e(data.content_fr)+'</div>'+(data.vocabulary?.length?'<section class="reading-vocab"><h2>Vocabulary</h2><ul>'+data.vocabulary.map(v=>'<li><strong>'+e(v.word)+'</strong> — '+e(v.meaning)+(v.example?'<p class="vocab-example">'+e(v.example)+'</p>':'')+(v.translation?'<p class="vocab-translation">'+e(v.translation)+'</p>':'')+'</li>').join("")+'</ul></section>':'')+(data.source_url?'<p>Source: '+e(data.source_title||data.source_name||"Original source")+'</p>':'');})();</script></body></html>
